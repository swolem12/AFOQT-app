<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table Reading (Coordinate Lookup) Test</title>
  <base href="/AFOQT-app/" />
  <style>
    body { font-family: monospace; background: #0a0e27; color: #00ffff; padding: 20px; }
    h1 { margin-top: 0; text-shadow: 0 0 8px #00ffff; }
    .controls { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    button { background: #00ffff; color: #0a0e27; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; }
    button:hover { background: #00cccc; }
    .note { color: #ffff66; margin: 8px 0; font-size: 14px; }
    .meta { margin-top: 8px; color: #99f6ff; }
    
    /* SCOPED TABLE READING STYLES - ALL UNDER .trTableScope */
    .trTableScope { 
      display: inline-block; 
      padding: 16px; 
      background: rgba(255,255,255,0.05); 
      border: 1px solid rgba(0,255,255,0.3); 
      border-radius: 8px; 
      box-shadow: 0 0 12px rgba(0,255,255,0.2);
      max-width: 90vw;
    }
    
    .trTableScope .trLegendWrap {
      margin-bottom: 8px;
      font-size: 13px;
      color: #9ae6b4;
    }
    
    .trTableScope .trTableWrap {
      position: relative;
      overflow: auto;
      max-height: 500px;
      max-width: 100%;
      border: 1px solid rgba(0,0,0,0.2);
      background: #ffffff;
    }
    
    .trTableScope .trTable {
      border-collapse: separate;
      border-spacing: 0;
      width: auto;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #222;
    }
    
    .trTableScope .trCorner {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 30;
      background: #d0d0d0;
      border: 1px solid #999;
      padding: 8px 12px;
      font-weight: normal;
      text-align: center;
      min-width: 50px;
    }
    
    .trTableScope .trColHdr {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #e8e8e8;
      border: 1px solid #aaa;
      padding: 8px 12px;
      font-weight: normal;
      text-align: center;
      min-width: 60px;
    }
    
    .trTableScope .trRowHdr {
      position: sticky;
      left: 0;
      z-index: 10;
      background: #e8e8e8;
      border: 1px solid #aaa;
      padding: 8px 12px;
      font-weight: normal;
      text-align: center;
      min-width: 50px;
    }
    
    .trTableScope .trCell {
      background: #fafafa;
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: center;
      min-width: 60px;
    }
    
    .trTableScope .trCell--target {
      background: linear-gradient(135deg, #ffffcc 0%, #ffeb99 100%);
      box-shadow: inset 0 0 4px rgba(255,200,0,0.6);
    }
    
    /* Pulse animation classes */
    @keyframes trPulse {
      0%, 100% { background-color: inherit; }
      50% { background-color: #fff4a3; }
    }
    
    .trTableScope .trPulseAnim {
      animation: trPulse 0.6s ease-in-out;
    }
  </style>
</head>
<body>
  <h1>Table Reading (Coordinate Lookup) Test</h1>
  <div class="note">Uses semantic HTML table with sticky X/Y headers and scoped styles. No global CSS leaked.</div>
  <div class="controls" id="controls"></div>
  <div id="tableContainer"></div>
  <div class="meta" id="meta"></div>

  <script>
    // Sample table specs
    const samples = [
      {
        id: 'Small 3x3',
        tableSpec: {
          xHeader: [-2, 0, 2],
          yHeader: [10, 20, 30],
          cellValues: [
            [15, 18, 21],
            [25, 28, 31],
            [35, 38, 41]
          ]
        },
        lookup: { x: 0, y: 20 }
      },
      {
        id: 'Medium 5x5',
        tableSpec: {
          xHeader: [-10, -5, 0, 5, 10],
          yHeader: [100, 200, 300, 400, 500],
          cellValues: [
            [110, 115, 120, 125, 130],
            [210, 215, 220, 225, 230],
            [310, 315, 320, 325, 330],
            [410, 415, 420, 425, 430],
            [510, 515, 520, 525, 530]
          ]
        },
        lookup: { x: 5, y: 300 }
      },
      {
        id: 'Large 8x6',
        tableSpec: {
          xHeader: [-20, -15, -10, -5, 0, 5, 10, 15],
          yHeader: [50, 100, 150, 200, 250, 300],
          cellValues: [
            [30, 35, 40, 45, 50, 55, 60, 65],
            [80, 85, 90, 95, 100, 105, 110, 115],
            [130, 135, 140, 145, 150, 155, 160, 165],
            [180, 185, 190, 195, 200, 205, 210, 215],
            [230, 235, 240, 245, 250, 255, 260, 265],
            [280, 285, 290, 295, 300, 305, 310, 315]
          ]
        },
        lookup: { x: -10, y: 150 }
      },
      {
        id: 'No Highlight',
        tableSpec: {
          xHeader: [1, 2, 3],
          yHeader: [10, 20, 30],
          cellValues: [
            [11, 12, 13],
            [21, 22, 23],
            [31, 32, 33]
          ]
        },
        lookup: null
      }
    ];

    function renderTableReading(tableSpec, lookup) {
      const { xHeader, yHeader, cellValues } = tableSpec;
      
      // Find target cell indices
      let targetRow = -1, targetCol = -1;
      if (lookup) {
        targetRow = yHeader.indexOf(lookup.y);
        targetCol = xHeader.indexOf(lookup.x);
      }

      // Build HTML
      let html = '<div class="trTableScope">';
      html += '<div class="trLegendWrap">X-axis (columns) and Y-axis (rows). Sticky headers for easy reference.</div>';
      html += '<div class="trTableWrap">';
      html += '<table class="trTable">';
      
      // Header row
      html += '<thead><tr>';
      html += '<th class="trCorner">X \\ Y</th>';
      xHeader.forEach((x, colIdx) => {
        const cls = (targetCol === colIdx && lookup) ? 'trColHdr trPulseAnim' : 'trColHdr';
        html += `<th class="${cls}">${x}</th>`;
      });
      html += '</tr></thead>';
      
      // Body rows
      html += '<tbody>';
      yHeader.forEach((y, rowIdx) => {
        html += '<tr>';
        const rowCls = (targetRow === rowIdx && lookup) ? 'trRowHdr trPulseAnim' : 'trRowHdr';
        html += `<th class="${rowCls}">${y}</th>`;
        cellValues[rowIdx].forEach((val, colIdx) => {
          const isTarget = (rowIdx === targetRow && colIdx === targetCol && lookup);
          const cellCls = isTarget ? 'trCell trCell--target trPulseAnim' : 'trCell';
          html += `<td class="${cellCls}">${val}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody>';
      
      html += '</table></div></div>';
      return html;
    }

    function showSample(sample) {
      const html = renderTableReading(sample.tableSpec, sample.lookup);
      document.getElementById('tableContainer').innerHTML = html;
      
      const lookupStr = sample.lookup 
        ? `X=${sample.lookup.x}, Y=${sample.lookup.y}` 
        : 'No lookup (no highlight)';
      const dims = `${sample.tableSpec.yHeader.length} rows × ${sample.tableSpec.xHeader.length} cols`;
      document.getElementById('meta').textContent = `Sample: ${sample.id} | ${dims} | Lookup: ${lookupStr}`;
    }

    function init() {
      const controls = document.getElementById('controls');
      samples.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.textContent = s.id;
        btn.onclick = () => showSample(s);
        if (idx === 0) btn.style.outline = '2px solid #ff00ff';
        controls.appendChild(btn);
      });
      showSample(samples[0]);
    }

    init();
  </script>
</body>
</html>
