<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/AFOQT-app/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AFOQT Quest - RPG-style study app with procedurally generated questions">
    <meta name="theme-color" content="#00ffff">
        <script>
        // Hard SW unregister on first load to avoid stale caches
        (function(){
            try {
                if ('serviceWorker' in navigator && !sessionStorage.getItem('swHardRefreshDone')) {
                    navigator.serviceWorker.getRegistrations().then(function(regs){
                        if (regs && regs.length) {
                            regs.forEach(function(reg){ reg.unregister(); });
                            sessionStorage.setItem('swHardRefreshDone','1');
                            // Reload to ensure fresh resources are fetched
                            location.reload();
                        }
                    }).catch(function(){});
                }
            } catch(e) { /* ignore */ }
        })();
        </script>
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AFOQT Quest">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    
    <title>AFOQT Quest</title>
    <link rel="stylesheet" href="styles.css">
    <script src="assets/libs/anime.min.js"></script>
    <script src="db.js"></script>
    <script src="patch-loader.js"></script>
    <script src="app.js" defer></script>
        <script>
            // Fallback: if app.js fails to load, show a helpful message
            document.addEventListener('DOMContentLoaded', function(){
                setTimeout(function(){
                    if (!window.__AFOQT_BOOT_MARKER__) {
                        var root=document.getElementById('app-root');
                        if (root) {
                            root.innerHTML = '<div style="color:#ff6666;font-family:monospace;padding:16px">Failed to load app.js. If you see this on GitHub Pages, try hard refresh or check that paths resolve under <code>/AFOQT-app/</code>.</div>';
                        }
                    }
                }, 800);
            });
        </script>
</head>
<body>
    <div id="app-root"><div style="color:#00ffff;font-family:monospace;padding:16px">Booting AFOQT Quest…</div></div>
</body>
</html>
