name: Update Version Manifest

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Generate version manifest
        run: |
          node .github/scripts/generate-version-manifest.js
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet Test Content/ app.js sw.js manifest.json index.html styles.css; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push version update
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Test\ Content/ version-manifest.json
          git commit -m "🔄 Auto-update version manifest" || echo "No changes to commit"
          git push
      
      - name: Notify version update
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "✅ Version manifest updated successfully"
          echo "Users will see a soft refresh on next visit"
