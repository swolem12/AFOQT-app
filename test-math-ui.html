<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math UI CSS Smoke Test</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background:#000; color:#00ffff; font-family: monospace; padding: 16px; }
    .section { margin-bottom: 32px; }
    .section h2 { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="section">
    <h2>Slope Graph (line from (-2,-1) to (3,4))</h2>
    <div id="slopeGraph"></div>
  </div>
  <div class="section">
    <h2>Coordinate Points (A, B, C)</h2>
    <div id="coordPoints"></div>
  </div>
  <div class="section">
    <h2>Translation (vector + arrows)</h2>
    <div id="translationDemo"></div>
  </div>
  <div class="section">
    <h2>Rotation 90° CCW around origin</h2>
    <div id="rotationDemo"></div>
  </div>
  <div class="section">
    <h2>Reflection across vertical line x = 1</h2>
    <div id="reflectionDemo"></div>
  </div>

  <script>
    function renderCoordinateGraphCss(uiSpec) {
      const { width = 300, height = 300, xRange = [-5, 5], yRange = [-5, 5], line, showGrid = true, showAxes = true } = uiSpec;
      const [xMin, xMax] = xRange;
      const [yMin, yMax] = yRange;
      const toPx = (x, y) => ({
        x: ((x - xMin) / (xMax - xMin)) * width,
        y: height - ((y - yMin) / (yMax - yMin)) * height
      });
      const origin = toPx(0, 0);
      let lineHtml = '';
      if (line && line.point1 && line.point2) {
        const p1 = toPx(line.point1.x, line.point1.y);
        const p2 = toPx(line.point2.x, line.point2.y);
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const length = Math.sqrt(dx*dx + dy*dy);
        const angle = Math.atan2(dy, dx) * (180/Math.PI);
        lineHtml = `
          <div class="graphLine" style="left:${p1.x}px; top:${p1.y}px; width:${length}px; transform: rotate(${angle}deg);"></div>
          <div class="graphPoint" style="left:${p1.x-4}px; top:${p1.y-4}px;"></div>
          <div class="graphPoint" style="left:${p2.x-4}px; top:${p2.y-4}px;"></div>
        `;
      }
      return `
        <div class="graphContainer" style="width:${width}px; height:${height}px;">
          ${showGrid ? '<div class="graphGrid"></div>' : ''}
          ${showAxes ? `<div class="graphAxis x" style="top:${origin.y}px;"></div><div class="graphAxis y" style="left:${origin.x}px;"></div>` : ''}
          ${lineHtml}
        </div>
      `;
    }

    function renderCoordinatePointsCss(uiSpec) {
      const { width = 300, height = 300, xRange = [-5, 5], yRange = [-5, 5], points = [], showGrid = true, line } = uiSpec;
      const [xMin, xMax] = xRange;
      const [yMin, yMax] = yRange;
      const toPx = (x, y) => ({
        x: ((x - xMin) / (xMax - xMin)) * width,
        y: height - ((y - yMin) / (yMax - yMin)) * height
      });
      const origin = toPx(0, 0);
      let elements = '';
      points.forEach(p => {
        const m = toPx(p.x, p.y);
        elements += `<div class="graphPoint" style="left:${m.x-4}px; top:${m.y-4}px;"></div>`;
        if (p.name) elements += `<div class="graphLabel" style="left:${m.x}px; top:${m.y}px;">${p.name}</div>`;
      });
      if (line && line.point1 && line.point2) {
        const p1 = toPx(line.point1.x, line.point1.y);
        const p2 = toPx(line.point2.x, line.point2.y);
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const length = Math.sqrt(dx*dx + dy*dy);
        const angle = Math.atan2(dy, dx) * (180/Math.PI);
        elements += `<div class="graphLine" style="left:${p1.x}px; top:${p1.y}px; width:${length}px; transform: rotate(${angle}deg);"></div>`;
      }
      return `
        <div class="graphContainer" style="width:${width}px; height:${height}px;">
          ${showGrid ? '<div class="graphGrid"></div>' : ''}
          <div class="graphAxis x" style="top:${origin.y}px;"></div>
          <div class="graphAxis y" style="left:${origin.x}px;"></div>
          ${elements}
        </div>
      `;
    }

    function renderTranslationCss(uiSpec) {
      const { width = 300, height = 300, xRange = [-5,5], yRange = [-5,5], points = [], vector, showGrid = true } = uiSpec;
      const [xMin,xMax]=xRange,[yMin,yMax]=yRange; const toPx=(x,y)=>({x:((x-xMin)/(xMax-xMin))*width,y:height-((y-yMin)/(yMax-yMin))*height});
      const origin=toPx(0,0);
      const translated = points.map(p=>({name:p.name,x:p.x+(vector?.dx||0),y:p.y+(vector?.dy||0)}));
      const seg=(a,b,cls='graphLine')=>{const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="${cls}" style="left:${a.x}px; top:${a.y}px; width:${len}px; transform: rotate(${ang}deg);"></div>`};
      const pt=(p,cls='graphPoint')=>`<div class="${cls}" style="left:${p.x-4}px; top:${p.y-4}px;"></div>`;
      const lbl=(p,name)=>name?`<div class="graphLabel" style="left:${p.x}px; top:${p.y}px;">${name}</div>`:'';
      const arr=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="graphArrow" style="left:${a.x}px; top:${a.y}px; width:${len}px; transform: rotate(${ang}deg);"><div class="graphArrowHead"></div></div>`};
      const mp=pts=>pts.map(p=>toPx(p.x,p.y)); const origPx=mp(points), transPx=mp(translated);
      let edgesOrig='',edgesGhost=''; if (origPx.length>=2){for(let i=0;i<origPx.length;i++){edgesOrig+=seg(origPx[i],origPx[(i+1)%origPx.length],'graphLine');edgesGhost+=seg(transPx[i],transPx[(i+1)%transPx.length],'graphLineGhost');}}
      let ptsHtml='',ptsGhostHtml='',labelsHtml='',arrowsHtml=''; for(let i=0;i<origPx.length;i++){ptsHtml+=pt(origPx[i],'graphPoint');ptsGhostHtml+=pt(transPx[i],'graphPointGhost');labelsHtml+=lbl(origPx[i],points[i].name||'');arrowsHtml+=arr(origPx[i],transPx[i]);}
      return `<div class="graphContainer" style="width:${width}px; height:${height}px;">${showGrid?'<div class="graphGrid"></div>':''}<div class="graphAxis x" style="top:${origin.y}px;"></div><div class="graphAxis y" style="left:${origin.x}px;"></div>${edgesGhost}${ptsGhostHtml}${edgesOrig}${ptsHtml}${labelsHtml}${arrowsHtml}</div>`;
    }

    function renderRotationCss(uiSpec) {
      const { width=300,height=300,xRange=[-5,5],yRange=[-5,5],points=[],center={x:0,y:0},showGrid=true,type,angle }=uiSpec;
      let deg=0; if(typeof angle==='number')deg=angle; else if(type==='rotation_90')deg=90; else if(type==='rotation_90_clockwise')deg=-90; else if(type==='rotation_180')deg=180;
      const rad=deg*Math.PI/180; const [xMin,xMax]=xRange,[yMin,yMax]=yRange; const toPx=(x,y)=>({x:((x-xMin)/(xMax-xMin))*width,y:height-((y-yMin)/(yMax-yMin))*height});
      const origin=toPx(0,0); const rot=p=>{const cx=center.x||0,cy=center.y||0;const dx=p.x-cx,dy=p.y-cy;return {name:p.name,x:cx+(dx*Math.cos(rad)-dy*Math.sin(rad)),y:cy+(dx*Math.sin(rad)+dy*Math.cos(rad))}};
      const rotated=points.map(rot);
      const seg=(a,b,cls='graphLine')=>{const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="${cls}" style="left:${a.x}px; top:${a.y}px; width:${len}px; transform: rotate(${ang}deg);"></div>`};
      const pt=(p,cls='graphPoint')=>`<div class="${cls}" style="left:${p.x-4}px; top:${p.y-4}px;"></div>`;
      const lbl=(p,name)=>name?`<div class="graphLabel" style="left:${p.x}px; top:${p.y}px;">${name}</div>`:'';
      const arr=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="graphArrow" style="left:${a.x}px; top:${a.y}px; width:${len}px; transform: rotate(${ang}deg);"><div class="graphArrowHead"></div></div>`};
      const mp=pts=>pts.map(p=>toPx(p.x,p.y)); const origPx=mp(points), rotPx=mp(rotated);
      let edgesOrig='',edgesGhost=''; if(origPx.length>=2){for(let i=0;i<origPx.length;i++){edgesOrig+=seg(origPx[i],origPx[(i+1)%origPx.length],'graphLine');edgesGhost+=seg(rotPx[i],rotPx[(i+1)%rotPx.length],'graphLineGhost');}}
      let ptsHtml='',ptsGhostHtml='',labelsHtml='',arrowsHtml=''; for(let i=0;i<origPx.length;i++){ptsHtml+=pt(origPx[i],'graphPoint');ptsGhostHtml+=pt(rotPx[i],'graphPointGhost');labelsHtml+=lbl(origPx[i],points[i].name||'');arrowsHtml+=arr(origPx[i],rotPx[i]);}
      return `<div class="graphContainer" style="width:${width}px; height:${height}px;">${showGrid?'<div class=\"graphGrid\"></div>':''}<div class="graphAxis x" style="top:${origin.y}px;"></div><div class="graphAxis y" style="left:${origin.x}px;"></div>${edgesGhost}${ptsGhostHtml}${edgesOrig}${ptsHtml}${labelsHtml}${arrowsHtml}</div>`;
    }

    function renderReflectionCss(uiSpec) {
      const { width=300,height=300,xRange=[-5,5],yRange=[-5,5],points=[],showGrid=true,type,lineValue }=uiSpec;
      const [xMin,xMax]=xRange,[yMin,yMax]=yRange; const toPx=(x,y)=>({x:((x-xMin)/(xMax-xMin))*width,y:height-((y-yMin)/(yMax-yMin))*height});
      const origin=toPx(0,0);
      let mirrorCss='', reflect;
      if(type==='reflection_vertical_line'){
        const k=typeof lineValue==='number'?lineValue:0; const mx=toPx(k,0).x; mirrorCss=`<div class="graphMirror" style="left:${mx}px; top:0; width:2px; height:100%;"></div>`; reflect=p=>({name:p.name,x:2*k-p.x,y:p.y});
      } else {
        const k=typeof lineValue==='number'?lineValue:0; const my=toPx(0,k).y; mirrorCss=`<div class="graphMirror" style="left:0; top:${my}px; width:100%; height:2px;"></div>`; reflect=p=>({name:p.name,x:p.x,y:2*k-p.y});
      }
      const reflected=points.map(reflect);
      const seg=(a,b,cls='graphLine')=>{const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="${cls}" style="left:${a.x}px; top:${a.y}px; width:${len}px; transform: rotate(${ang}deg);"></div>`};
      const pt=(p,cls='graphPoint')=>`<div class="${cls}" style="left:${p.x-4}px; top:${p.y-4}px;"></div>`;
      const lbl=(p,name)=>name?`<div class="graphLabel" style="left:${p.x}px; top:${p.y}px;">${name}</div>`:'';
      const arr=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<div class="graphArrow" style="left:${a.x}px; top:${a.y}px; width:${len}px; transform: rotate(${ang}deg);"><div class="graphArrowHead"></div></div>`};
      const mp=pts=>pts.map(p=>toPx(p.x,p.y)); const origPx=mp(points), refPx=mp(reflected);
      let edgesOrig='',edgesGhost=''; if(origPx.length>=2){for(let i=0;i<origPx.length;i++){edgesOrig+=seg(origPx[i],origPx[(i+1)%origPx.length],'graphLine');edgesGhost+=seg(refPx[i],refPx[(i+1)%refPx.length],'graphLineGhost');}}
      let ptsHtml='',ptsGhostHtml='',labelsHtml='',arrowsHtml=''; for(let i=0;i<origPx.length;i++){ptsHtml+=pt(origPx[i],'graphPoint');ptsGhostHtml+=pt(refPx[i],'graphPointGhost');labelsHtml+=lbl(origPx[i],points[i].name||'');arrowsHtml+=arr(origPx[i],refPx[i]);}
      return `<div class="graphContainer" style="width:${width}px; height:${height}px;">${showGrid?'<div class=\"graphGrid\"></div>':''}<div class="graphAxis x" style="top:${origin.y}px;"></div><div class="graphAxis y" style="left:${origin.x}px;"></div>${mirrorCss}${edgesGhost}${ptsGhostHtml}${edgesOrig}${ptsHtml}${labelsHtml}${arrowsHtml}</div>`;
    }

    // Inject examples
    const slope = renderCoordinateGraphCss({
      width: 320, height: 320, xRange: [-5,5], yRange: [-5,5], showGrid: true, showAxes: true,
      line: { point1: {x:-2, y:-1}, point2: {x:3, y:4} }
    });
    document.getElementById('slopeGraph').innerHTML = slope;

    const points = renderCoordinatePointsCss({
      width: 320, height: 320, xRange: [-5,5], yRange: [-5,5], showGrid: true,
      points: [
        {name:'A', x:2, y:3},
        {name:'B', x:-1, y:2},
        {name:'C', x:0, y:-3}
      ]
    });
    document.getElementById('coordPoints').innerHTML = points;

    const translation = renderTranslationCss({
      width: 320, height: 320, xRange: [-5,5], yRange: [-5,5], showGrid: true,
      points: [ {name:'A',x:-2,y:1}, {name:'B',x:1,y:1}, {name:'C',x:-1,y:-2} ],
      vector: { dx: 2, dy: -1 }
    });
    document.getElementById('translationDemo').innerHTML = translation;

    const rotation = renderRotationCss({
      width: 320, height: 320, xRange: [-5,5], yRange: [-5,5], showGrid: true,
      type: 'rotation_90', center: {x:0,y:0},
      points: [ {name:'P',x:2,y:1}, {name:'Q',x:3,y:-1} ]
    });
    document.getElementById('rotationDemo').innerHTML = rotation;

    const reflection = renderReflectionCss({
      width: 320, height: 320, xRange: [-5,5], yRange: [-5,5], showGrid: true,
      type: 'reflection_vertical_line', lineValue: 1,
      points: [ {name:'R',x:-1,y:2}, {name:'S',x:0,y:-2} ]
    });
    document.getElementById('reflectionDemo').innerHTML = reflection;
  </script>
</body>
</html>
